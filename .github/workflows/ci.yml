name: Greybox CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-greybox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify design contracts
        run: |
          python3 tools/verify_design.py
          git diff --exit-code -- design/verification_report.json
      - name: Install pinned Godot 4.6.2 Standard
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          sha="30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937"
          curl -fL "$url" -o /tmp/godot.zip
          echo "$sha  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.6.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version | tee /tmp/godot-version.txt
          grep -q "4.6.2.stable" /tmp/godot-version.txt
      - name: Import project headlessly
        run: /tmp/godot/godot --headless --path . --editor --quit
      - name: T01 contract tests
        run: /tmp/godot/godot --headless --path . --script tests/contract_test.gd
      - name: T02 rule tests
        run: /tmp/godot/godot --headless --path . --script tests/rules/rules_test.gd
      - name: T03 state tests
        run: /tmp/godot/godot --headless --path . --script tests/state/state_test.gd
      - name: T04 save tests
        run: /tmp/godot/godot --headless --path . --script tests/save/save_test.gd
      - name: T05 navigation tests
        run: /tmp/godot/godot --headless --path . --script tests/ui/navigation_test.gd
      - name: Boot main scene
        run: /tmp/godot/godot --headless --path .
