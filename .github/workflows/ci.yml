name: Greybox CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-greybox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify design contracts
        run: |
          python3 tools/verify_design.py
          git diff --exit-code -- design/verification_report.json
      - name: Install pinned Godot 4.6.2 Standard
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip"
          sha="30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937"
          curl -fL "$url" -o /tmp/godot.zip
          echo "$sha  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v4.6.2-stable_linux.x86_64 /tmp/godot/godot
          chmod +x /tmp/godot/godot
          /tmp/godot/godot --version | tee /tmp/godot-version.txt
          grep -q "4.6.2.stable" /tmp/godot-version.txt
      - name: Import project headlessly
        run: /tmp/godot/godot --headless --path . --editor --quit
      - name: All runtime scripts, 17 puzzles, save migration and UI
        run: python3 tools/run_godot_tests.py /tmp/godot/godot
      - name: Independent expansion solvers
        run: |
          python3 tools/verify_expansion.py
          git diff --exit-code -- design/expansion_verification.json
      - name: Runtime content parity
        run: |
          cmp design/puzzles.json content/puzzles.json
          cmp design/hints_fr.json content/hints_fr.json
      - name: Boot main scene
        run: /tmp/godot/godot --headless --path .
