name: Premium slice review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned renderer
        run: |
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo '30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot* /tmp/godot/godot
          chmod +x /tmp/godot/godot
      - name: Import and test
        run: |
          /tmp/godot/godot --headless --path . --editor --quit
          python3 tools/run_godot_tests.py /tmp/godot/godot
      - name: Capture real Godot rendering
        run: |
          xvfb-run -a -s '-screen 0 1200x2100x24' /tmp/godot/godot --path . --rendering-method gl_compatibility --audio-driver Dummy --resolution 540x960 --script tools/slice/capture.gd 2>&1 | tee /tmp/slice-render.log
          ! grep -E 'SCRIPT ERROR|Shader compilation failed' /tmp/slice-render.log
          test -f build/slice-captures/06-conclusion.png
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-render-review
          path: |
            build/slice-captures
            /tmp/slice-render.log
